# QuantOS cockpit + cloud API routes, shared by the http and https servers
# in quantos-cockpit.conf. Deployed at /etc/nginx/snippets/quantos-locations.conf.
# The server block that includes this sets root, index and basic auth.

location = /health {
    auth_basic off;
    proxy_pass http://127.0.0.1:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location /webhook/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# Every other real backend path the cockpit (or a manual curl check)
# calls. Regex location so proxy_pass forwards the original URI
# (including query string) unchanged -- no path rewriting.
location ~ ^/(signals|market|discovery|observability|options|positions|analyst|regime|status|auth|darvas-atr-stop|reports|fno-picks|spreads) {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location / {
    try_files $uri $uri/ /index.html;
}
