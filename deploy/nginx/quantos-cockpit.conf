# QuantOS Cockpit + Cloud API — nginx site config
# ─────────────────────────────────────────────────
# Deployed at /etc/nginx/sites-available/quantos-cockpit on the Oracle VM
# (symlinked from sites-enabled). Serves the static cockpit SPA AND
# reverse-proxies the cloud API (quantos-cloud-api.service, uvicorn on
# 127.0.0.1:8000) from the same origin — added 2026-07-31 when the API
# moved off Railway (trial expired) onto self-hosting here.
#
# Same-origin is a real security improvement, not just a lift-and-shift:
# on Railway, endpoints like /signals and /analyst/chat had to be public
# (a browser SPA on a different origin can never safely hold a shared
# secret — Vite inlines VITE_ env vars into the public JS bundle). Now
# they sit behind the SAME basic auth as the static site; the browser's
# cached Basic-auth credentials cover same-origin fetch() calls
# automatically, no frontend code change needed.
#
# Two carve-outs stay outside basic auth, both explicit `auth_basic off;`:
#   - /health — standard public liveness-probe convention, no sensitive data.
#   - /webhook/ — TradingView and Telegram hit these directly and can't do
#     interactive Basic auth; each has its own shared-secret validation in
#     application code (WEBHOOK_SECRET / TELEGRAM_WEBHOOK_SECRET), same
#     protection model the old Railway deployment already relied on.
#
# TLS (added 2026-10-21): https://161-118-189-29.sslip.io, a wildcard-DNS
# name that resolves to this IP, so Let's Encrypt can issue a certificate
# without buying a domain. Needed because ICICI's login posts the Breeze
# session token to our callback, and Chrome holds back an https -> http form
# post behind a "form is not secure" page. Plain http on the bare IP stays up
# (TradingView/Telegram webhooks and old bookmarks use it).
# Routes live in snippets/quantos-locations.conf so both servers match.
# Certificate: certbot --webroot, renewed by certbot.timer, nginx reloaded by
# the deploy hook in /etc/letsencrypt/renewal-hooks/deploy/.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/quantos-cockpit;
    index index.html;

    auth_basic "QuantOS Cockpit";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot -w /var/www/letsencrypt).
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/letsencrypt;
    }

    include snippets/quantos-locations.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 161-118-189-29.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/161-118-189-29.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/161-118-189-29.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/quantos-cockpit;
    index index.html;

    auth_basic "QuantOS Cockpit";
    auth_basic_user_file /etc/nginx/.htpasswd;

    include snippets/quantos-locations.conf;
}
